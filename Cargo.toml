[workspace]
resolver = "2"
members = ["crates/shared", "crates/rules", "crates/ai-check", "crates/hl-order", "crates/coin", "crates/coin/wire", "crates/coin/stub", "crates/mock-usdc", "crates/lender", "crates/stickers", "crates/launchpad", "crates/coin/sandbox"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# Pinned exactly. 5.30.1 was the newest on crates.io on 2026-11-11 and is what the hl-guard probe ran on testnet.
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
