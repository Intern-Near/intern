[package]
name = "launchpad"
version = "0.1.0"
description = "The $INTERN launchpad (01 1.3, section 9.5): launch a memecoin, trade it on a constant-product curve in USDC; a fee on each trade goes to the BRAVE pool."
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
