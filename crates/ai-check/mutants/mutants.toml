[[mutant]]
id = "R17"
check = 4
file = "src/lib.rs"
what = "check 4 skipped: any request passes"
find = '    if !request_ok(pinned, expected, request) {'
replace = '    if false && !request_ok(pinned, expected, request) {'

# ---------------------------------------------------------------- check 5: the decision line (MALFORMED_DECISION)

[[mutant]]
id = "L1"
check = 5
file = "src/lib.rs"
what = "blank lines, spaces and tabs around the line are trimmed off"
find = '    let line = answer_text(&body)?;'
replace = '    let line = answer_text(&body)?.trim();'

[[mutant]]
id = "L2"
check = 5
file = "src/lib.rs"
what = "a newline after the line passes"
find = '    let line = answer_text(&body)?;'
replace = '''    let line = answer_text(&body)?.trim_end_matches('\n');'''

[[mutant]]
id = "L3"
check = 5
file = "src/lib.rs"
what = "blank lines before the line pass (the Qwen padding)"
find = '    let line = answer_text(&body)?;'
replace = '''    let line = answer_text(&body)?.trim_start_matches('\n');'''

[[mutant]]
id = "L4"
check = 5
file = "src/lib.rs"
what = "the round is read from the line, not compared with the program's"
find = '''
    let decision = line::parse(line, expected.round_id, expected.nonce)?;
    if decision_line(expected.round_id, expected.nonce, &decision) != line {'''
replace = '''
    let round_id = line.strip_prefix(r#"{"v":1,"round":"#).and_then(|r| r.split(',').next()).and_then(|r| r.parse().ok()).unwrap_or(expected.round_id);
    let decision = line::parse(line, round_id, expected.nonce)?;
    if decision_line(round_id, expected.nonce, &decision) != line {'''

[[mutant]]
id = "L5"
check = 5
file = "src/lib.rs"
what = "the nonce is read from the line, not compared with the program's"
find = '''
    let decision = line::parse(line, expected.round_id, expected.nonce)?;
    if decision_line(expected.round_id, expected.nonce, &decision) != line {'''
replace = '''
    let nonce = line.split(r#""nonce":""#).nth(1).and_then(|r| r.split('"').next()).unwrap_or(expected.nonce);
    let decision = line::parse(line, expected.round_id, nonce)?;
    if decision_line(expected.round_id, nonce, &decision) != line {'''

[[mutant]]
id = "L6"
check = 5
file = "src/line.rs"
what = "line reader: the round's form is checked, its value is not"
find = '''
    let head = format!(r#"{{"v":1,"round":{round_id},"nonce":"{nonce}","action":"#);
    let rest = line.strip_prefix(head.as_str())?;'''
replace = '''
    let _ = round_id;
    let rest = line.strip_prefix(r#"{"v":1,"round":"#)?;
    let (round, rest) = rest.split_once(',')?;
    if !canonical_digits(round) {
        return None;
    }
    let rest = rest.strip_prefix(format!(r#""nonce":"{nonce}","action":"#).as_str())?;'''

[[mutant]]
id = "L7"
check = 5
file = "src/line.rs"
what = "line reader: the nonce is not checked"
find = '''
    let head = format!(r#"{{"v":1,"round":{round_id},"nonce":"{nonce}","action":"#);
    let rest = line.strip_prefix(head.as_str())?;'''
replace = '''
    let _ = nonce;
    let rest = line.strip_prefix(format!(r#"{{"v":1,"round":{round_id},"nonce":""#).as_str())?;
    let (_, rest) = rest.split_once('"')?;
    let rest = rest.strip_prefix(r#","action":"#)?;'''

[[mutant]]
id = "L8"
check = 5
file = "src/line.rs"
what = "line reader: the version v is not checked"
find = '''
    let head = format!(r#"{{"v":1,"round":{round_id},"nonce":"{nonce}","action":"#);
    let rest = line.strip_prefix(head.as_str())?;'''
replace = '''
    let head = format!(r#","round":{round_id},"nonce":"{nonce}","action":"#);
    let rest = line.strip_prefix(r#"{"v":"#)?.get(1..)?.strip_prefix(head.as_str())?;'''

[[mutant]]
id = "L9"
check = 5
file = "src/lib.rs"
what = "the write-back comparison with decision_line is dropped"
find = '    if decision_line(expected.round_id, expected.nonce, &decision) != line {'
replace = '    if false && decision_line(expected.round_id, expected.nonce, &decision) != line {'
equivalent = """line.rs matches only the canonical text of a line, so writing the decision it read back out always gives \
the same bytes: this comparison is a second guard that cannot fire while line.rs is right. The tests hold each \
guard on its own instead: the line reader alone is held to the same rules (L6 to L8, L12 to L15)."""

[[mutant]]
