check = 5
file = "src/lib.rs"
what = "the answer is taken from the first of several choices"
find = '    let [choice] = body.get("choices")?.as_array()? else {'
replace = '    let [choice, ..] = body.get("choices")?.as_array()? else {'

[[mutant]]
