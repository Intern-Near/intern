what = "line reader: numbers with leading zeros read"
find = '''    !s.is_empty() && s.bytes().all(|b| b.is_ascii_digit()) && (s == "0" || !s.starts_with('0'))'''
replace = '    !s.is_empty() && s.bytes().all(|b| b.is_ascii_digit())'

[[mutant]]
id = "L14"
check = 5
file = "src/line.rs"
what = "line reader: a sign before a number reads (+20000000)"
find = '''    !s.is_empty() && s.bytes().all(|b| b.is_ascii_digit()) && (s == "0" || !s.starts_with('0'))'''
replace = '''    !s.is_empty() && (s == "0" || !s.starts_with('0'))'''

[[mutant]]
id = "L15"
check = 5
file = "src/line.rs"
what = "line reader: \"long\" reads as short"
find = '        (Side::Long, r)'
replace = '        (Side::Short, r)'

