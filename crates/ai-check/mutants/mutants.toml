# Hand-written mutants of checks 3 to 5 (crates/ai-check/src). Each one is a small, plausible mistake: a check
# skipped, loosened or turned around. run.py puts one mutant at a time into the source, runs the tests, and puts the
# original file back byte for byte.
#
# Fields: `id`, `check` (3, 4 or 5; the JSON reader serves checks 4 and 5), `file` (relative to crates/ai-check),
# `what` (the mistake in plain words), `find` (text that must occur exactly once in the file) and `replace`.
# A mutant with `equivalent` set behaves exactly like the original by construction; the text says why. It is run too
# (it must survive), but it is not counted among the mutants the tests must catch.

# ---------------------------------------------------------------- check 3: the signature (BAD_MODEL_SIGNATURE)

[[mutant]]
id = "S1"
check = 3
file = "src/lib.rs"
what = "check 3 skipped: any signature passes"
find = '    if !signature_ok(host, pinned, request, response, signature) {'
replace = '    if false && !signature_ok(host, pinned, request, response, signature) {'

[[mutant]]
id = "S2"
check = 3
file = "src/lib.rs"
what = "check 3 turned around: a good signature is refused, a bad one passes"
find = '    if !signature_ok(host, pinned, request, response, signature) {'
replace = '    if signature_ok(host, pinned, request, response, signature) {'

[[mutant]]
id = "S3"
check = 3
file = "src/lib.rs"
what = "ed25519: any 64-byte signature passes"
find = '            host.ed25519_verify(sig, &text, key)'
replace = '            host.ed25519_verify(sig, &text, key) || true'

[[mutant]]
id = "S4"
check = 3
file = "src/lib.rs"
what = "ed25519: bytes after the 64-byte signature are ignored"
find = '                <&[u8; 64]>::try_from(signature),'
replace = '                <&[u8; 64]>::try_from(signature.get(..64).unwrap_or(signature)),'

[[mutant]]
id = "S5"
check = 3
file = "src/lib.rs"
what = "signed text: the request is hashed twice, the response never"
find = '    push_hex(&mut text, &host.sha256(response));'
replace = '    push_hex(&mut text, &host.sha256(request));'

[[mutant]]
id = "S6"
check = 3
file = "src/lib.rs"
what = "signed text: hashes written in upper-case hex"
find = '    const HEX: &[u8; 16] = b"0123456789abcdef";'
replace = '    const HEX: &[u8; 16] = b"0123456789ABCDEF";'

[[mutant]]
id = "S7"
check = 3
file = "src/lib.rs"
what = "ECDSA: any recovered signer passes"
find = '            host.keccak256(&public_key).get(12..) == Some(pinned.signer)'
replace = '            host.keccak256(&public_key).get(12..).is_some()'

[[mutant]]
id = "S8"
check = 3
file = "src/lib.rs"
what = "ECDSA: only the first 4 bytes of the signer's address are compared"
find = '            host.keccak256(&public_key).get(12..) == Some(pinned.signer)'
replace = '            host.keccak256(&public_key).get(12..16) == pinned.signer.get(..4)'

[[mutant]]
id = "S9"
check = 3
file = "src/lib.rs"
what = "ECDSA: a v other than 0, 1, 27, 28 is read as recovery id 0"
find = '''
                27 | 28 => v - 27,
                _ => return false,'''
replace = '''
                27 | 28 => v - 27,
                _ => 0,'''

[[mutant]]
id = "S10"
check = 3
file = "src/lib.rs"
what = "ECDSA: v of 2 or 3 is passed to the host as it is"
find = '                0 | 1 => v,'
replace = '                0..=3 => v,'

[[mutant]]
id = "S11"
check = 3
file = "src/lib.rs"
what = "checks 3 and 4 run in the wrong order"
find = '''
    if !signature_ok(host, pinned, request, response, signature) {
        return Err(Refusal::BadModelSignature);
    }
    if !request_ok(pinned, expected, request) {
        return Err(Refusal::WrongRulebook);
    }'''
replace = '''
    if !request_ok(pinned, expected, request) {
        return Err(Refusal::WrongRulebook);
    }
    if !signature_ok(host, pinned, request, response, signature) {
        return Err(Refusal::BadModelSignature);
    }'''

