[package]
name = "ai-check"
version = "0.2.0"
description = "Checks 3 to 5 of the $INTERN program: the model's signature, the rulebook, the decision line (Engine 2)."
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Engine 1's shared crate (01-SHARED-INTERFACE.md section 11): the Host trait and the enums. Nothing else.
shared = { path = "../shared" }

[dev-dependencies]
ed25519-dalek = "3.0.0"
k256 = "0.14.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
sha3 = "0.12.0"
